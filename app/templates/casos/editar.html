{% extends "base.html" %}

{% block titulo %}Editar caso{% endblock %}

{% block contenido %}
    <h2>Editar caso</h2>
    <form method="POST">
        <input type="text" name="titulo" value="{{ caso.titulo }}" required><br>
        <textarea name="descripcion">{{ caso.descripcion or "" }}</textarea><br>
        <select name="tipo">
            <option value="transito" {% if caso.tipo == "transito" %}selected{% endif %}>Accidente de tránsito</option>
            <option value="laboral" {% if caso.tipo == "laboral" %}selected{% endif %}>Accidente laboral</option>
        </select><br>
        <select name="estado">
            <option value="abierto" {% if caso.estado == "abierto" %}selected{% endif %}>Abierto</option>
            <option value="en_analisis" {% if caso.estado == "en_analisis" %}selected{% endif %}>En análisis</option>
            <option value="cerrado" {% if caso.estado == "cerrado" %}selected{% endif %}>Cerrado</option>
        </select><br>
        <button type="submit">Guardar cambios</button>
    </form>
{% endblock %}
